[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ahia-r2-book-intelligence"
version = "0.1.0"
description = "Desktop AI book intelligence demonstration using a small decoder-only Transformer trained from random initialization and grounded on personal-finance books via BM25."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "AHIA-R2 Research Team" }
]
keywords = [
    "transformer",
    "information-retrieval",
    "bm25",
    "personal-finance",
    "pyside6",
    "pure-pytorch",
    "offline-ai",
    "from-scratch"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "torch>=2.1.0",
    "pyside6>=6.5.0",
    "numpy>=1.24.0",
    "pypdf>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "service*", "ui*", "database*"]
exclude = ["tests*", "data*", "checkpoints*", "docs*"]
